<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>아빠의 인생 런! - 생일 축하 게임</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 10px;
      background-color: #e0f2fe;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      user-select: none;
      touch-action: manipulation;
    }
    h1 {
      color: #0284c7;
      font-size: 22px;
      margin-top: 5px;
      margin-bottom: 10px;
      text-align: center;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }
    #gameContainer {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 320px;
      background-color: #ffffff;
      background-image: url('bg.png'), url('bg.jpg'), linear-gradient(to bottom, #bae6fd, #ffffff);
      background-size: 1280px 320px;
      background-repeat: no-repeat;
      background-position: 0px bottom;
      border-bottom: 4px solid #38bdf8;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      cursor: pointer;
      touch-action: none;
    }

    #player {
      position: absolute;
      bottom: -6px;
      left: 50px;
      width: 105px;
      height: 135px;
      background-image: url('dad1.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: bottom center;
      z-index: 10;
    }

    .obstacle {
      position: absolute;
      bottom: -3px;
      width: 54px;
      height: 70px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: bottom center;
      z-index: 15;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
    }

    #endingArea {
      display: none;
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 30;
      background: rgba(240, 249, 255, 0.45);
      backdrop-filter: blur(2px);
      padding: 15px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      animation: fadeIn 0.5s ease;
    }

    #letterContainer {
      width: 100%;
      max-width: 700px;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #letterImg {
      max-width: 95%;
      max-height: 260px;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .ending-obstacles {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 6px;
      align-items: flex-end;
      padding: 5px;
      z-index: 35;
      opacity: 0.95;
      height: 45px;
      flex-wrap: wrap;
    }
    .ending-obs-item {
      width: 25px;
      height: 35px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: bottom center;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    #giveupModal {
      display: none;
    }

    .overlay-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.65);
      z-index: 50;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      animation: fadeIn 0.3s ease;
    }
    #startModal {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      padding: 24px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      max-width: 85%;
      width: 340px;
    }
    .modal-title {
      font-size: 20px;
      font-weight: bold;
      color: #0284c7;
      margin-bottom: 10px;
    }
    .modal-desc {
      font-size: 14px;
      color: #334155;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      flex: 1;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn-start {
      background-color: #0284c7;
      color: #ffffff;
      font-size: 16px;
      padding: 14px 24px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
      width: 100%;
    }
    .btn-retry {
      background-color: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }
    .btn-giveup {
      background-color: #f1f5f9;
      color: #64748b;
    }

    #message {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #0284c7;
      text-align: center;
      min-height: 45px;
      line-height: 1.4;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #instruction {
      margin-bottom: 10px;
      color: #64748b;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }

    #soundBtn {
      position: fixed;
      top: 12px;
      right: 12px;
      background-color: #ffffff;
      border: 2px solid #38bdf8;
      color: #0284c7;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      z-index: 100;
    }
  </style>
</head>
<body>

  <button id="soundBtn">🔊 SOUND ON</button>

  <audio id="runBgm" src="bgm.mp3" loop preload="auto"></audio>
  <audio id="failSound" src="fail.mp3" preload="auto"></audio>
  <audio id="successBgm" src="success.mp3" preload="auto"></audio>

  <h1>🏃‍♂️ 아빠의 인생 런! 🎂</h1>
  <div id="instruction">화면을 터치하거나 스페이스바를 눌러 장애물을 넘으세요!</div>
  
  <div id="gameContainer">
    <div id="player"></div>
    
    <div id="endingArea">
      <div id="letterContainer">
        <img id="letterImg" src="letter.png" alt="아빠에게 보내는 편지">
      </div>
      <div class="ending-obstacles" id="endingObsContainer"></div>
    </div>

    <div id="startModal" class="overlay-modal">
      <div class="modal-box">
        <div class="modal-title">🎂 아빠의 인생 런 🏃‍♂️</div>
        <div class="modal-desc">
          오늘은 아빠의 생일입니다.<br>
          하지만 생일 파티에 도착하려면<br>
          <b>아빠가 살아온 길을 다시 달려야 합니다!</b>
        </div>
        <button id="startBtn" class="btn btn-start">🚀 52년 전으로 돌아가기</button>
      </div>
    </div>

    <div id="failModal" class="overlay-modal">
      <div class="modal-box">
        <div class="modal-title">💥 앗! 인생의 장애물에 부딪혔어요!</div>
        <div class="modal-desc">여기서 멈추실 건가요? 다시 힘내서 달려보세요!</div>
        <div class="btn-group">
          <button id="retryBtn" class="btn btn-retry">🏃 살빼야지! 다시 달리기</button>
          <button id="giveupBtn" class="btn btn-giveup">🐷 돼지될래.. 그만두기</button>
        </div>
      </div>
    </div>

    <div id="giveupModal" class="overlay-modal">
      <div class="modal-box">
        <div class="modal-title">😭 나홀로 생일파티...</div>
        <div class="modal-desc">
          아빠는 생일파티에 도착하지 못했습니다..<br>
          <b>🎈 52년 전에서 나홀로 생일파티 🎂</b>
        </div>
        <button id="restartFromGiveupBtn" class="btn btn-start">🏃 다시 도전하기</button>
      </div>
    </div>

  </div>
  
  <div id="message"></div>

  <script>
    const player = document.getElementById('player');
    const container = document.getElementById('gameContainer');
    const message = document.getElementById('message');
    const endingArea = document.getElementById('endingArea');
    const endingObsContainer = document.getElementById('endingObsContainer');
    
    const startModal = document.getElementById('startModal');
    const failModal = document.getElementById('failModal');
    const giveupModal = document.getElementById('giveupModal');
    
    const startBtn = document.getElementById('startBtn');
    const retryBtn = document.getElementById('retryBtn');
    const giveupBtn = document.getElementById('giveupBtn');
    const restartFromGiveupBtn = document.getElementById('restartFromGiveupBtn');

    const runBgm = document.getElementById('runBgm');
    const failSound = document.getElementById('failSound');
    const successBgm = document.getElementById('successBgm');
    const soundBtn = document.getElementById('soundBtn');

    let isJumping = false;
    let nextObsIndex = 0;
    let clearedCount = 0;
    let activeObstaclesCount = 0;
    let gameStarted = false;
    let gameOver = false;
    let gameWon = false;
    let soundStarted = false;
    let isMuted = false;
    let spawnTimeoutId = null;
    let bgLoopInterval = null;

    let playerFrame = 1;
    let runAnimInterval = null;

    let bgPositionX = 0;
    // 끝까지 딱 맞춰 도착하도록 배경 이동 속도를 미세 상향 (0.11 -> 0.16)
    const bgSpeed = 0.16; 
    let lastObstacleSpeed = 3.5;

    const playerBaseBottom = -6;

    const obstacleImages = [];
    for (let i = 1; i <= 21; i++) {
      obstacleImages.push(`obg${i}.png`);
    }

    function startBackgroundLoop() {
      if (bgLoopInterval) clearInterval(bgLoopInterval);
      bgLoopInterval = setInterval(() => {
        if (gameStarted && !gameOver && !gameWon) {
          const maxScroll = -480; 
          if (bgPositionX > maxScroll) {
            bgPositionX -= bgSpeed;
          } else {
            bgPositionX = maxScroll;
          }
          container.style.backgroundPosition = `${bgPositionX}px bottom`;
        }
      }, 16);
    }

    function startRunAnimation() {
      if (runAnimInterval) clearInterval(runAnimInterval);
      runAnimInterval = setInterval(() => {
        if (gameStarted && !gameOver && !gameWon) {
          playerFrame = playerFrame === 1 ? 2 : 1;
          player.style.backgroundImage = `url('dad${playerFrame}.png')`;
        }
      }, 150);
    }

    function startAudio() {
      if (!soundStarted && !isMuted) {
        runBgm.play().then(() => {
          soundStarted = true;
        }).catch(e => {
          console.log("자동재생 제약:", e);
        });
      }
    }

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startModal.style.display = 'none';
      gameStarted = true;
      startAudio();
      startRunAnimation();
      startBackgroundLoop();
      spawnObstacle();
    });

    function handleInput(e) {
      if (!gameStarted || gameOver || gameWon) return; 
      if (e && e.type === 'touchstart' && e.cancelable) {
        e.preventDefault();
      }
      startAudio();
      jump();
    }

    window.addEventListener('touchstart', handleInput, { passive: false });
    window.addEventListener('pointerdown', (e) => {
      if (gameStarted) startAudio();
    });
    window.addEventListener('click', (e) => {
      if (gameStarted) startAudio();
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        handleInput(e);
      }
    });

    function resetAndRestart() {
      if (spawnTimeoutId) {
        clearTimeout(spawnTimeoutId);
        spawnTimeoutId = null;
      }

      document.querySelectorAll('.obstacle').forEach(obs => obs.remove());

      isJumping = false;
      nextObsIndex = 0;
      clearedCount = 0;
      activeObstaclesCount = 0;
      gameOver = false;
      gameWon = false;
      gameStarted = true;
      lastObstacleSpeed = 3.5;

      bgPositionX = 0;
      container.style.backgroundPosition = `0px bottom`;

      failModal.style.display = 'none';
      giveupModal.style.display = 'none';
      startModal.style.display = 'none';
      endingArea.style.display = 'none';
      message.innerHTML = '';

      player.style.display = 'block';
      player.style.bottom = `${playerBaseBottom}px`;

      runBgm.currentTime = 0;
      failSound.pause();
      failSound.currentTime = 0;

      if (!isMuted) {
        runBgm.play().catch(e => console.log("자동재생 제한:", e));
        soundStarted = true;
      }

      startRunAnimation();
      startBackgroundLoop();
      spawnObstacle();
    }

    retryBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      resetAndRestart();
    });

    restartFromGiveupBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      resetAndRestart();
    });

    giveupBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      failModal.style.display = 'none';
      giveupModal.style.display = 'flex';
    });

    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isMuted = !isMuted;
      if (isMuted) {
        runBgm.pause();
        failSound.pause();
        successBgm.pause();
        soundBtn.innerText = "🔇 SOUND OFF";
      } else {
        soundBtn.innerText = "🔊 SOUND ON";
        if (gameStarted && !gameOver && !gameWon) {
          runBgm.play();
          soundStarted = true;
        } else if (gameOver) {
          failSound.play();
        } else if (gameWon) {
          successBgm.play();
        }
      }
    });

    function jump() {
      if (isJumping || !gameStarted || gameOver || gameWon) return;
      isJumping = true;
      let jumpHeight = 0;
      
      let upInterval = setInterval(() => {
        if (jumpHeight >= 140) {
          clearInterval(upInterval);
          let downInterval = setInterval(() => {
            if (jumpHeight <= 0) {
              clearInterval(downInterval);
              isJumping = false;
              player.style.bottom = `${playerBaseBottom}px`;
            }
            jumpHeight -= 4.5;
            player.style.bottom = (playerBaseBottom + Math.max(0, jumpHeight)) + 'px';
          }, 16);
        }
        jumpHeight += 8;
        player.style.bottom = (playerBaseBottom + jumpHeight) + 'px';
      }, 16);
    }

    function spawnObstacle() {
      if (!gameStarted || gameOver || gameWon || nextObsIndex >= obstacleImages.length) return;

      const currentImg = obstacleImages[nextObsIndex];
      nextObsIndex++;
      activeObstaclesCount++;

      const obstacle = document.createElement('div');
      obstacle.classList.add('obstacle');
      obstacle.style.backgroundImage = `url('${currentImg}')`;

      const containerWidth = container.clientWidth || 800;
      let obstacleLeft = containerWidth;
      obstacle.style.left = obstacleLeft + 'px';
      container.appendChild(obstacle);

      let moveSpeed = Math.min(lastObstacleSpeed, Math.random() * 1.0 + 2.8);
      lastObstacleSpeed = moveSpeed;

      let moveInterval = setInterval(() => {
        if (gameOver || gameWon) {
          clearInterval(moveInterval);
          obstacle.remove();
          return;
        }

        obstacleLeft -= moveSpeed;
        obstacle.style.left = obstacleLeft + 'px';

        const currentJumpPos = parseInt(player.style.bottom || `${playerBaseBottom}`) - playerBaseBottom;

        if (obstacleLeft > 40 && obstacleLeft < 115 && currentJumpPos < 45) {
          gameOver = true;
          clearInterval(moveInterval);
          if (runAnimInterval) clearInterval(runAnimInterval);
          if (bgLoopInterval) clearInterval(bgLoopInterval);
          
          runBgm.pause();
          runBgm.currentTime = 0;
          
          if (!isMuted) {
            failSound.currentTime = 0;
            failSound.play();
          }

          failModal.style.display = 'flex';
        }

        if (obstacleLeft < -60) {
          clearInterval(moveInterval);
          obstacle.remove();
          activeObstaclesCount--;
          clearedCount++;

          if (clearedCount >= obstacleImages.length && activeObstaclesCount === 0) {
            triggerEnding();
          }
        }
      }, 16);

      if (nextObsIndex < obstacleImages.length) {
        let safeSpawnDelay = Math.random() * 800 + 2400; 
        spawnTimeoutId = setTimeout(spawnObstacle, safeSpawnDelay);
      }
    }

    function triggerEnding() {
      gameWon = true;
      if (runAnimInterval) clearInterval(runAnimInterval);
      if (bgLoopInterval) clearInterval(bgLoopInterval);

      bgPositionX = -480;
      container.style.backgroundPosition = `-480px bottom`;

      player.style.display = 'none';
      endingArea.style.display = 'flex';

      runBgm.pause();
      runBgm.currentTime = 0;

      if (!isMuted) {
        successBgm.currentTime = 0;
        successBgm.play();
      }

      endingObsContainer.innerHTML = '';
      obstacleImages.forEach(imgName => {
        const obsEl = document.createElement('div');
        obsEl.classList.add('ending-obs-item');
        obsEl.style.backgroundImage = `url('${imgName}')`;
        endingObsContainer.appendChild(obsEl);
      });

      message.innerHTML = "🎉 52년간 달려온 아빠의 완주를 축하합니다! 🎉";
    }
  </script>
</body>
</html>
